{% extends "base.html" %}
{% block title %}Delete Activity{% endblock %}
{% block content %}
<h1>Delete "{{ activity.title }}"?</h1>
<p>This cannot be undone.</p>
<form method="post" class="card">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Confirm Delete</button>
</form>
{% endblock %}
