{% extends "base.html" %}
{% block title %}{{ mode }} Asset{% endblock %}
{% block content %}
<h1>{{ mode }} Asset</h1>
<form method="post" class="card">
  {% csrf_token %}
  {% for field in form %}
    <div class="form-group">{{ field.label_tag }} {{ field }} {{ field.errors }}</div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Save Asset</button>
</form>
{% endblock %}
