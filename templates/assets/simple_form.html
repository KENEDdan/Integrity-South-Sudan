{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="card">
  {% csrf_token %}
  {% for field in form %}
    <div class="form-group">{{ field.label_tag }} {{ field }} {{ field.errors }}</div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
