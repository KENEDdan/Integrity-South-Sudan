{% extends "base.html" %}
{% block title %}Record Transaction{% endblock %}
{% block content %}
<h1>Record Income / Expense</h1>
<form method="post" class="card">
  {% csrf_token %}
  <div class="form-grid">
    {% for field in form %}
      <div class="form-group">{{ field.label_tag }} {{ field }} {{ field.errors }}</div>
    {% endfor %}
  </div>
  <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Save Transaction</button>
</form>
{% endblock %}
